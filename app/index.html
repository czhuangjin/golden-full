<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黄金定制 软路由管理后台</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --sidebar-bg: #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-active: #2563eb;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-light: #64748b;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

    /* Login */
    #loginScreen { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 420px; max-width: 90%; }
    .login-box h1 { margin: 0 0 8px; font-size: 24px; color: var(--sidebar-bg); }
    .login-box .subtitle { color: var(--text-light); margin-bottom: 28px; font-size: 13px; }
    /* 只读访客模式：隐藏提交/危险操作按钮，显示提示条 */
    .role-guest .form-actions .btn-success,
    .role-guest .form-actions .btn-danger { display: none !important; }
    .guest-readonly-banner { display: none; align-items: center; gap: 8px; background: #fef3c7; color: #92400e; padding: 8px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
    .role-guest .guest-readonly-banner { display: flex; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #334155; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: border .2s; }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-default { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-default:hover { background: #f8fafc; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .login-hint { margin-top: 18px; padding: 10px 12px; background: #eff6ff; border-left: 3px solid var(--primary); border-radius: 4px; color: #1e40af; font-size: 12px; }

    /* App layout */
    #app { display: none; height: 100vh; flex-direction: column; }
    .topbar { height: 56px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 18px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
    .version-info { color: var(--text-light); font-size: 12px; display: flex; gap: 16px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar a { color: var(--text-light); font-size: 13px; text-decoration: none; }
    .topbar a:hover { color: var(--primary); }

    .layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 240px; background: var(--sidebar-bg); color: #cbd5e1; overflow-y: auto; flex-shrink: 0; }
    .menu-category { border-bottom: 1px solid #1e293b; }
    .menu-title { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; font-weight: 600; color: #e2e8f0; transition: background .2s; user-select: none; }
    .menu-title:hover { background: var(--sidebar-hover); }
    .menu-title.active { background: var(--sidebar-active); color: #fff; }
    .menu-title .arrow { transition: transform .2s; font-size: 12px; }
    .menu-title.open .arrow { transform: rotate(90deg); }
    .menu-items { display: none; background: #020617; }
    .menu-items.open { display: block; }
    .menu-item { padding: 10px 16px 10px 40px; cursor: pointer; font-size: 13px; color: #94a3b8; transition: all .2s; border-left: 3px solid transparent; }
    .menu-item:hover { background: #0f172a; color: #fff; }
    .menu-item.active { background: #0f172a; color: #fff; border-left-color: var(--primary); }

    .main { flex: 1; overflow-y: auto; padding: 20px; }
    .breadcrumb { margin-bottom: 16px; color: var(--text-light); font-size: 13px; }
    .breadcrumb span { color: var(--text); font-weight: 500; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .page-header h2 { margin: 0; font-size: 20px; font-weight: 600; }
    .card { background: var(--card-bg); border-radius: 10px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
    .card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 18px; }

    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .status-card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .status-card .label { color: var(--text-light); font-size: 12px; margin-bottom: 6px; }
    .status-card .value { font-size: 20px; font-weight: 700; color: var(--text); }
    .status-card .unit { font-size: 12px; color: var(--text-light); margin-left: 4px; }

    .info-table { width: 100%; border-collapse: collapse; }
    .info-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .info-table td:first-child { width: 160px; color: var(--text-light); background: #f8fafc; font-weight: 500; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 10px 12px; border: 1px solid var(--border); text-align: left; font-size: 13px; }
    .data-table th { background: #f1f5f9; font-weight: 600; }
    .data-table tr:nth-child(even) { background: #fafafa; }
    .data-table tr:hover { background: #f0f9ff; }

    .form-row { display: flex; align-items: center; margin-bottom: 14px; gap: 12px; }
    .form-row label { width: 140px; text-align: right; color: var(--text-light); flex-shrink: 0; }
    .form-row .input-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
    .form-row input, .form-row select, .form-row textarea { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; min-width: 220px; outline: none; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--primary); }
    .form-row input[type="checkbox"] { min-width: auto; }
    .form-row .hint { color: var(--text-light); font-size: 12px; }
    .form-actions { padding: 14px 0 0 152px; display: flex; gap: 10px; }

    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .tab { padding: 10px 18px; cursor: pointer; color: var(--text-light); border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab:hover { color: var(--primary); }

    .pagination { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--text-light); }
    .pagination button { padding: 4px 10px; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; }
    .pagination button:hover { background: #f8fafc; }
    .pagination input { width: 40px; text-align: center; padding: 4px; border: 1px solid var(--border); border-radius: 4px; }

    .context-menu { position: fixed; background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); z-index: 999; display: none; min-width: 130px; }
    .context-menu div { padding: 8px 14px; cursor: pointer; font-size: 13px; }
    .context-menu div:hover { background: #f1f5f9; color: var(--primary); }
    /* 主机监控：显示控制菜单（浅黄背景 + 复选框） */
    .context-menu.ctx-menu-check { background: #fdf9e3; border-color: #e6d99a; min-width: 190px; padding: 6px 0; }
    .context-menu.ctx-menu-check .ctx-check { display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text); font-weight: normal; }
    .context-menu.ctx-menu-check .ctx-check:hover { background: #f7eec0; }
    .context-menu.ctx-menu-check .ctx-check input { min-width: auto; width: 14px; height: 14px; }
    /* 主机监控：可排序表头 */
    .data-table th.sortable { cursor: pointer; user-select: none; }
    .data-table th.sortable:hover { background: #e2e8f0; color: var(--primary); }

    .toast { position: fixed; top: 20px; right: 20px; background: #10b981; color: #fff; padding: 10px 18px; border-radius: 8px; box-shadow: var(--shadow); z-index: 200; display: none; font-size: 13px; }
    .chart-placeholder { height: 200px; background: #f8fafc; border: 1px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-light); }

    .empty-state { padding: 40px; text-align: center; color: var(--text-light); }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 10px; opacity: .4; }

    /* LAN / QoS additions */
    .checkbox-group { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .checkbox-group label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-weight: normal; color: var(--text); }
    .help-panel { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-size: 12px; color: var(--text-light); line-height: 1.8; }
    .help-panel strong { color: var(--text); }
    .help-panel code { background: #e2e8f0; padding: 1px 4px; border-radius: 3px; }
    .inline-form { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px; background: #f8fafc; border-radius: 8px; margin-top: 14px; }
    .inline-form label { font-size: 12px; color: var(--text-light); }
    .inline-form input, .inline-form select { padding: 6px 8px; font-size: 12px; min-width: 140px; }
    .small-input { width: 80px; min-width: 80px !important; }
    .sub-section { font-weight: 600; color: var(--text); margin: 18px 0 10px; font-size: 13px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-success { background: #d1fae5; color: #047857; }
    .badge-gray { background: #e2e8f0; color: #64748b; }
    .wan-bandwidth-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .wan-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: #fafafa; }
    .wan-card .wan-title { font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .wan-status { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; }
    .stat-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .stat-row .bar { flex: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
    .stat-row .bar-fill { height: 100%; background: var(--primary); border-radius: 4px; }
    .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .switch input { width: 36px; height: 20px; -webkit-appearance: none; appearance: none; background: #cbd5e1; border-radius: 10px; position: relative; outline: none; cursor: pointer; transition: background .2s; }
    .switch input:checked { background: var(--success); }
    .switch input::after { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform .2s; }
    .switch input:checked::after { transform: translateX(16px); }
    /* 负载均衡 / 多WAN / 通用新增 */
    .lb-line-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; background: #fafafa; }
    .lb-line-card .wan-title { font-weight: 600; margin-bottom: 10px; color: var(--primary); }
    .radio-inline { display: inline-flex; align-items: center; gap: 4px; font-weight: normal; color: var(--text); margin-right: 10px; cursor: pointer; }
    .form-row label { min-width: 150px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 120; display: none; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: 10px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 520px; max-width: 90%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .modal-header .close { cursor: pointer; color: var(--text-light); font-size: 18px; line-height: 1; }
    .modal-header .close:hover { color: var(--danger); }
    .modal-body { padding: 18px; overflow-y: auto; }
    .modal-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
    .app-type-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .app-type-grid label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: normal; color: var(--text); font-size: 13px; }
    .app-type-grid input { min-width: auto; }
    .app-types-display { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .app-types-display .tag { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-size: 12px; }

    @media (max-width: 768px) {
      .sidebar { position: absolute; z-index: 20; height: 100%; transform: translateX(-100%); transition: transform .2s; }
      .sidebar.show { transform: translateX(0); }
      .form-row { flex-direction: column; align-items: flex-start; }
      .form-row label { text-align: left; }
      .form-actions { padding-left: 0; }
      .wan-bandwidth-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>黄金定制 软路由</h1>
    <div class="subtitle">企业级多 WAN 高性能路由管理后台</div>
    <div class="form-group">
      <label>用户名</label>
      <input id="loginUser" placeholder="root / guest" autocomplete="username" />
    </div>
    <div class="form-group">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="请输入登录密码" autocomplete="current-password" />
    </div>
    <div id="loginError" style="display:none;color:#dc2626;font-size:13px;margin-bottom:10px;text-align:center;"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;padding:12px;" onclick="doLogin()">登 录</button>
    <div class="login-hint" id="loginHint">正在检测运行模式...</div>
    <button class="btn btn-default" id="demoEnterBtn" style="width:100%;margin-top:10px;display:none" onclick="enterDemo()">以演示模式进入</button>
  </div>
</div>

<div class="modal-overlay" id="firstLoginModal">
  <div class="modal-box" style="width:460px">
    <div class="modal-header"><span>首次登录：请修改管理员密码</span></div>
    <div class="modal-body">
      <div style="background:#fef3c7;color:#92400e;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:14px">出于安全考虑，首次登录必须修改默认密码（出厂默认 admin）。修改前请勿将路由器暴露到外网。</div>
      <div class="form-row"><label>新密码</label><div class="input-wrap"><input type="password" id="firPass" placeholder="6-32 位" style="width:200px" autocomplete="new-password"></div></div>
      <div class="form-row"><label>确认新密码</label><div class="input-wrap"><input type="password" id="firPassConfirm" placeholder="再次输入" style="width:200px" autocomplete="new-password"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-success" onclick="submitFirstLoginPass()">确认修改</button>
      <button class="btn btn-default" onclick="closeFirstLoginModal()">暂不修改</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">黄金定制</div>
      <div class="version-info">
        <span>版本：黄金定制 H-2.01.779</span>
        <span id="sysTime">系统时间：--</span>
      </div>
    </div>
    <div class="topbar-right">
      <span id="topUserInfo" style="color:var(--text-light);font-size:13px;"></span>
      <a href="#" onclick="alert('保存设置成功'); return false;">保存设置</a>
      <span style="color:var(--border)">|</span>
      <a href="#" onclick="alert('操作提示：左侧菜单选择功能，右侧进行配置。'); return false;">提示帮助</a>
      <span style="color:var(--border)">|</span>
      <a href="#" onclick="doLogout(); return false;">退出登录</a>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main">
      <div class="breadcrumb" id="breadcrumb">系统信息 / 运行状态</div>
      <div class="guest-readonly-banner" id="guestBanner">🔒 当前为只读访客模式，仅可查看，不能修改任何配置。如需管理请使用管理员账号登录。</div>
      <div id="pageContent"></div>
    </div>
  </div>
</div>

<div class="context-menu" id="contextMenu"></div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="appTypeModal" onclick="if(event.target===this) closeAppTypeSelector()">
  <div class="modal-box">
    <div class="modal-header"><span>选择你要过滤的应用类型</span><span class="close" onclick="closeAppTypeSelector()">&times;</span></div>
    <div class="modal-body">
      <div class="app-type-grid" id="appTypeGrid"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-success" onclick="confirmAppTypes()">确定</button>
      <button class="btn btn-default" onclick="closeAppTypeSelector()">取消</button>
    </div>
  </div>
</div>

<script>
const menuData = [
  {
    id: 'sysinfo', title: '系统信息', open: true,
    items: [
      { id: 'runstatus', title: '运行状态' },
      { id: 'status', title: '状态概述' },
      { id: 'traffic', title: '流量分析' },
      { id: 'hosts', title: '主机监控' },
      { id: 'logins', title: '登录路由器用户' }
    ]
  },
  {
    id: 'basic', title: '基本设置', open: true,
    items: [
      { id: 'network', title: '网络设置' },
      { id: 'routername', title: '路由名称' },
      { id: 'time', title: '时间设置' },
      { id: 'ddns', title: 'DDNS设置' },
      { id: 'dnsresolve', title: '域名特殊解析' }
    ]
  },
  {
    id: 'qos', title: '智能QoS',
    items: [
      { id: 'bandwidth', title: '带宽设置' },
      { id: 'speedlimit', title: '速度限制' },
      { id: 'bandwidthguarantee', title: '带宽保证' }
    ]
  },
  {
    id: 'security', title: '安全设置',
    items: [
      { id: 'connlimit', title: '联线数设置' },
      { id: 'connectlimit', title: '连接限制' },
      { id: 'ddosdefense', title: 'DDOS攻击防御' },
      { id: 'dhcpdetect', title: '私接DHCP探测' },
      { id: 'wanharden', title: '安全加固' },
      { id: 'secevents', title: '安全事件中心' }
    ]
  },
  {
    id: 'behavior', title: '行为管理',
    items: [
      { id: 'applimit', title: '应用限制' },
      { id: 'accesscontrol', title: '访问控制' },
      { id: 'domainredirect', title: '域名重定向' },
      { id: 'domainfilter', title: '域名过滤' },
      { id: 'dnsaudit', title: '上网行为审计' },
      { id: 'iplimit', title: 'IP段限制' }
    ]
  },
  {
    id: 'arp', title: 'ARP管理',
    items: [
      { id: 'arpdefense', title: 'ARP安全防御' },
      { id: 'arpbind', title: 'ARP绑定' },
      { id: 'arplist', title: 'ARP列表' },
      { id: 'arplog', title: 'ARP日志' }
    ]
  },
  {
    id: 'policy', title: '策略路由',
    items: [
      { id: 'loadbalance', title: '负载均衡' },
      { id: 'bandwidthagg', title: '带宽叠加' },
      { id: 'ctcnc', title: '电信网通地址' },
      { id: 'policyroute', title: '策略路由' },
      { id: 'linestatus', title: '线路状态' },
      { id: 'routelog', title: '日志记录' }
    ]
  },
  {
    id: 'portmap', title: '端口映射',
    items: [
      { id: 'portmapping', title: '端口映射' },
      { id: 'dmz', title: 'DMZ设置' },
      { id: 'porttrigger', title: '端口触发' },
      { id: 'upnp', title: 'UPnP设置' }
    ]
  },

window.__goldenBridge = window.__goldenBridge || {};
window.__goldenBridge.mockRef = mock;

/* ===== 真实模式登录回调（golden-bridge.js 探测完成后触发） ===== */
window.__goldenBridge.onProbe = function (res) {
  goldenAuth.real = res.real;
  const hint = document.getElementById('loginHint');
  const demoBtn = document.getElementById('demoEnterBtn');
  if (res.real) {
    if (res.authed) {
      goldenAuth.role = res.role || 'admin';
      goldenAuth.user = res.user || 'root';
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      startApp();
    } else {
      if (hint) hint.textContent = '请输入系统用户名和密码（默认 root / admin）';
      if (demoBtn) demoBtn.style.display = 'none';
    }
  } else {
    if (hint) hint.textContent = '演示模式：配置仅保存在本地浏览器';
    if (demoBtn) demoBtn.style.display = 'block';
  }
};
window.__goldenBridge.onAuthRequired = function () {
  goldenAuth.token = '';
  document.body.classList.remove('role-guest');
  location.reload();
};
window.__goldenBridge.onForbidden = function (msg) { showToast(msg || '访客账号为只读权限'); };

let currentRoute = 'runstatus';
let currentTabs = {};
let contextTarget = null;
let connContextTarget = null;
let currentConnHost = null;
let editingQoSRule = null;
let editingGuaranteeRule = null;
let editingSubnet = null;

/* ===== 真实模式登录与会话 ===== */
let goldenAuth = { real: false, token: '', role: 'admin', user: 'root', firstLogin: false };
window.__goldenAuth = goldenAuth;

function enterDemo() {
  goldenAuth.real = false;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  startApp();
}

function startApp() {
  renderSidebar();
  renderPage(currentRoute);
  setInterval(updateSysTime, 1000);
  updateSysTime();
  updateTopbarUser();
  if (goldenAuth.real) {
    document.body.classList.toggle('role-guest', goldenAuth.role === 'guest');
    if (goldenAuth.firstLogin) showFirstLoginModal();
  }
}

function updateTopbarUser() {
  const el = document.getElementById('topUserInfo');
  if (!el) return;
  el.textContent = goldenAuth.real
    ? `当前用户：${goldenAuth.user}（${goldenAuth.role === 'admin' ? '管理员' : '只读访客'}）`
    : '演示模式（配置仅保存在本地）';
}

async function doLogin() {
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  if (!goldenAuth.real) { enterDemo(); return; }
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!user || !pass) { errEl.textContent = '请输入用户名和密码'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const r = await window.__goldenBridge.login(user, pass);
    if (r && r.ok) {
      goldenAuth.real = true;
      goldenAuth.role = r.role;
      goldenAuth.user = r.user;
      goldenAuth.firstLogin = r.firstLogin;
      errEl.style.display = 'none';
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      startApp();
    } else {
      errEl.textContent = (r && r.error) || '登录失败';
      errEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = '网络错误，请重试';
    errEl.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = '登 录';
}

function doLogout() {
  if (goldenAuth.real && window.__goldenBridge && window.__goldenBridge.logout) window.__goldenBridge.logout();
  goldenAuth.token = '';
  goldenAuth.real = false;
  location.reload();
}

/* ===== 首次登录强制修改密码 ===== */
function showFirstLoginModal() { document.getElementById('firstLoginModal').classList.add('show'); }
function closeFirstLoginModal() { document.getElementById('firstLoginModal').classList.remove('show'); }
async function submitFirstLoginPass() {
  const p1 = document.getElementById('firPass').value;
  const p2 = document.getElementById('firPassConfirm').value;
  if (!p1 || p1.length < 6) { showToast('新密码长度不能低于 6 位'); return; }
  if (p1 !== p2) { showToast('两次输入的密码不一致'); return; }
  const r = await window.__goldenBridge.set('advanced', { adminPass: p1, adminPassConfirm: p2 });
  if (r && r.ok) {
    goldenAuth.firstLogin = false;
    closeFirstLoginModal();
    showToast('管理员密码已修改，请牢记新密码');
  } else {
    showToast((r && r.error) || '密码修改失败，请重试');
  }
}

function updateSysTime() {
  const now = new Date();
  const pad = n => n.toString().padStart(2, '0');
  document.getElementById('sysTime').textContent = `系统时间：${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = menuData.map(cat => `
    <div class="menu-category">
      <div class="menu-title ${cat.open ? 'open' : ''}" onclick="toggleCat('${cat.id}')">
        <span>${cat.title}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="menu-items ${cat.open ? 'open' : ''}" id="cat-${cat.id}">
        ${cat.items.map(it => `
          <div class="menu-item ${currentRoute===it.id ? 'active' : ''}" onclick="navTo('${it.id}')">${it.title}</div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleCat(id) {
  const cat = menuData.find(c => c.id === id);
  cat.open = !cat.open;
  renderSidebar();
}

function navTo(id) {
  currentRoute = id;
  renderSidebar();
  renderPage(id);
}

function getRoute() {
  for (const cat of menuData) {
    const it = cat.items.find(i => i.id === currentRoute);
    if (it) return { cat, item: it };
  }
  return { cat: menuData[0], item: menuData[0].items[0] };
}

function renderPage(id) {
  const { cat, item } = getRoute();
  document.getElementById('breadcrumb').innerHTML = `${cat.title} / <span>${item.title}</span>`;
  const content = document.getElementById('pageContent');
  const render = pageRenderers[id] || pageRenderers.placeholder;
  content.innerHTML = render(id);
  if (pageAfterRender[id]) pageAfterRender[id]();
}

  bandwidthagg: () => {
    const agg = mock.bandwidthAgg;
    const joined = agg.lines.filter(l => l.join);
    const totalWeight = joined.reduce((s, l) => s + l.weight, 0) || 1;
    return `
    <div class="page-header"><h2>带宽叠加</h2><button class="btn btn-default" onclick="renderPage('bandwidthagg')">刷新</button></div>
    <div class="card"><div class="card-body">
      <div class="help-panel">
        <strong>带宽叠加说明</strong>：将多条广域网线路的带宽合并使用，内网主机发起的会话由内核按线路权值智能分配到各条出口线路，从而汇聚出更高的总带宽（如 2 条 100M 线路叠加后理论总带宽 200M）。<br>
        <strong>权值</strong>：线路容量越大，权值应设置得越大，内核分配会话的比例越高。<br>
        <strong>提示</strong>：带宽叠加与「负载均衡-依IP/依会话数」可配合使用；叠加仅对勾选且状态在线的线路生效，掉线线路会自动从叠加组中剔除。
      </div>
    </div></div>
    <div class="card"><div class="card-header">叠加设置</div><div class="card-body">
      <div class="form-row"><label>带宽叠加</label><div class="input-wrap"><label class="switch"><input type="checkbox" ${agg.enabled?'checked':''} id="aggEnabled" onchange="toggleBandwidthAgg()"><span></span></label><span class="hint">启用后按下方线路配置将多线路带宽合并使用</span></div></div>
      <div class="form-row"><label>叠加模式</label><div class="input-wrap">
        <select id="aggMode" onchange="setAggMode(this.value)">
          <option value="smart" ${agg.mode==='smart'?'selected':''}>智能叠加（按权值分配会话）</option>
          <option value="manual" ${agg.mode==='manual'?'selected':''}>会话均分（各线路会话数均衡）</option>
        </select>
        <span class="hint">智能叠加：新会话按线路权值比例分配；会话均分：新会话轮询分配到参与线路</span>
      </div></div>
    </div></div>
    <div class="card"><div class="card-header">参与叠加的线路</div><div class="card-body">
      <table class="data-table" id="aggLineTable">
        <thead><tr><th>参与</th><th>线路名称</th><th>状态</th><th>上行带宽(KByte)</th><th>下行带宽(KByte)</th><th>权值</th><th>分配比例</th><th>当前会话</th></tr></thead>
        <tbody id="aggLineBody">
          ${agg.lines.map((l, i) => {
            const ratio = l.join ? (l.weight / totalWeight * 100) : 0;
            return `<tr>
              <td><input type="checkbox" ${l.join?'checked':''} onchange="toggleAggLine(${i}, this.checked)"></td>
              <td><strong>${l.wan}</strong></td>
              <td>${l.status === '在线' ? '<span style="color:var(--success)">在线</span>' : '<span style="color:var(--danger)">掉线</span>'}</td>
              <td><input class="small-input" style="width:70px" value="${l.up}" onchange="setAggBandwidth(${i}, 'up', this.value)"></td>
              <td><input class="small-input" style="width:70px" value="${l.down}" onchange="setAggBandwidth(${i}, 'down', this.value)"></td>
              <td><input class="small-input" style="width:50px" value="${l.weight}" onchange="setAggWeight(${i}, this.value)"></td>
              <td>${l.join ? ratio.toFixed(1) + '%' : '—'}</td>
              <td class="agg-session-cell" data-i="${i}">${l.join ? l.sessions : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div style="margin-top:8px;color:var(--text-light);font-size:12px;">提示：勾选参与叠加的线路，设置各线路带宽与权值后，右上角实时区域将显示叠加结果。</div>
      <div class="form-actions" style="margin-top:12px"><button class="btn btn-success" onclick="saveBandwidthAgg()">提交设置</button><button class="btn btn-default" onclick="renderPage('bandwidthagg')">取消设置</button></div>
    </div></div>
    <div class="card"><div class="card-header">叠加效果统计</div><div class="card-body">
      <div class="status-grid">
        <div class="status-card"><div class="label">叠加后总上行带宽</div><div class="value" id="aggTotalUp">${joined.reduce((s,l)=>s+l.up,0)}<span class="unit">KByte</span></div></div>
        <div class="status-card"><div class="label">叠加后总下行带宽</div><div class="value" id="aggTotalDown">${joined.reduce((s,l)=>s+l.down,0)}<span class="unit">KByte</span></div></div>
        <div class="status-card"><div class="label">参与线路数</div><div class="value" id="aggLineCount">${joined.length}<span class="unit">条</span></div></div>
        <div class="status-card"><div class="label">当前总会话数</div><div class="value" id="aggTotalSessions">${joined.reduce((s,l)=>s+l.sessions,0)}</div></div>
      </div>
      <div style="margin-top:16px;display:flex;align-items:center;gap:12px;">
        <span class="hint" style="margin:0">刷新间隔</span>
        <select style="width:90px" onchange="setAggInterval(this.value)">
          <option value="2">2 秒</option>
          <option value="5">5 秒</option>
          <option value="10">10 秒</option>
        </select>
        <button class="btn btn-default btn-sm" id="aggStopBtn" onclick="toggleAggStop()">停止</button>
      </div>
      <canvas id="aggChart" width="820" height="240" style="width:100%;height:240px;background:var(--card-bg);margin-top:12px"></canvas>
      <div id="aggLiveArea" style="margin-top:12px"></div>
    </div></div>
  `},

function placeholder(title, desc) {
  const { item } = getRoute();
  return `

        <div style="font-weight:600;margin-bottom:6px;">${item.title}</div>
        <div>${desc}</div>
      </div>
    </div></div>
  `;
}

function simpleForm(title, fields, saveMsg) {
  return `
    <div class="page-header"><h2>${title}</h2></div>
    <div class="card"><div class="card-body">
      ${fields.map(([label, val, extra]) => `
        <div class="form-row"><label>${label}</label>
          <div class="input-wrap">
            ${extra === 'checkbox' ? `<input type="checkbox" ${val ? 'checked' : ''}>` : `<input value="${val}">`}
            ${extra && extra !== 'checkbox' ? `<span class="hint">${extra}</span>` : ''}
          </div>
        </div>
      `).join('')}
      <div class="form-actions"><button class="btn btn-success" onclick="showToast('${saveMsg}')">提交设置</button><button class="btn btn-default">取消设置</button></div>
    </div></div>
  `;
}

function logTable(title, rows) {
  return `
    <div class="page-header"><h2>${title}</h2><button class="btn btn-default" onclick="showToast('已刷新')">刷新</button></div>
    <div class="card"><div class="card-body">
      <table class="data-table"><thead><tr><th>时间</th><th>类型</th><th>内容</th><th>来源 IP</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${r.time}</td><td>${r.type}</td><td>${r.content}</td><td>${r.source}</td></tr>`).join('')}</tbody>
      </table>
      ${renderPagination(1, 1)}
    </div></div>
  `;
}

function renderPagination(cur, total, totalCount) {
  const count = totalCount === undefined ? mock.hosts.length : totalCount;
  return `<div class="pagination">共：${count} 条记录 当前 ${cur}/${total} 页 <button>第一页</button><button>上一页</button><button>下一页</button><button>最后页</button> 前往 <input value="${cur}"> 页</div>`;
}

/* ===== LAN Multi-subnet helpers ===== */
function renderSubnetsRows() {
  if (!mock.subnets.length) return `<tr><td colspan="3" style="text-align:center;color:var(--text-light)">暂无子网段</td></tr>`;
  return mock.subnets.map((s, idx) => `
    <tr data-idx="${idx}">
      <td>${s.ip}</td><td>${s.mask}</td>
      <td>
        <button class="btn btn-default btn-sm" onclick="editSubnet(${idx})">修改</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSubnet(${idx})">删除</button>
      </td>
    </tr>
  `).join('');
}

function toggleMultiSubnet() {
  const on = document.getElementById('multiSubnetOn').checked;
  document.getElementById('multiSubnetSection').style.display = on ? 'block' : 'none';
}

function saveSubnet() {
  const ip = document.getElementById('subnetIp').value.trim();
  const mask = document.getElementById('subnetMask').value.trim();
  if (!ip || !mask) { showToast('请填写 IP 和子网掩码'); return; }
  if (editingSubnet !== null) {
    mock.subnets[editingSubnet] = { ip, mask };
    showToast('子网段已修改');
  } else {
    mock.subnets.push({ ip, mask });
    showToast('子网段已添加');
  }
  editingSubnet = null;
  renderPage('network');
}

function editSubnet(idx) {
  editingSubnet = idx;
  const s = mock.subnets[idx];
  document.getElementById('subnetIp').value = s.ip;
  document.getElementById('subnetMask').value = s.mask;
  document.getElementById('subnetBtn').textContent = '修改';
}

function cancelSubnetEdit() {
  editingSubnet = null;
  renderPage('network');
}

function deleteSubnet(idx) {
  mock.subnets.splice(idx, 1);
  showToast('子网段已删除');
  renderPage('network');
}

  const mode = document.getElementById('qosRuleMode').value;

function ipCompare(a, b) {
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d;
  }
  return 0;
}
function arpCompare(a, b) {
  const sa = String(a == null ? '' : a);
  const sb = String(b == null ? '' : b);
  return sa.localeCompare(sb, 'zh');
}
function sortByArpKey(list, key, dir) {
  if (!key) return list.slice();
  return list.slice().sort((x, y) => {
    const d = key === 'ip' ? ipCompare(x[key], y[key]) : arpCompare(x[key], y[key]);
    return d * dir;
  });
}
function toggleArpSort(state, key) {
  if (state.key === key) state.dir = -state.dir;
  else { state.key = key; state.dir = 1; }
}
function arpTh(label, key, state, sortFn) {
  const active = state.key === key;
  const arrow = active ? (state.dir === 1 ? ' ▲' : ' ▼') : '';
  return `<th class="sortable" onclick="${sortFn}('${key}')" title="点击按「${label}」排序">${label}${arrow}</th>`;
}
function sortedArpBind() { return sortByArpKey(mock.arpBind, window.arpBindSort.key, window.arpBindSort.dir); }
function sortedArpList() { return sortByArpKey(mock.arpList, window.arpListSort.key, window.arpListSort.dir); }

let trafficAnalysisTimer = null;

let trafficAnalysisIntervalSec = 2;
const TRAFFIC_CURVES = { upReq: { color: '#2563eb', label: '上传需求' }, upAlloc: { color: '#10b981', label: '上传调配' }, downReq: { color: '#f59e0b', label: '下传需求' }, downAlloc: { color: '#ef4444', label: '下传调配' } };

function sumTraffic(rows, field) {
  // field 形如 'upReqSpeed'，数值带单位，取数字部分累加
  return rows.reduce((s, r) => s + (parseFloat(r[field]) || 0), 0);
}

function sumPackets(rows, field) {
  return rows.reduce((s, r) => s + (r[field] || 0), 0);
}

function fmtNum(n, unit) {
  if (n >= 1000) return (n / 1000).toFixed(2) + ' ' + unit + 'K';
  return n.toFixed(0) + ' ' + unit;
}

function renderTrafficSummary(idx) {
  const link = mock.trafficLinks[idx] || mock.trafficLinks[0];
  const rows = Object.values(link.rows);

  return `
    <div class="sub-section" style="margin-top:16px">累计数据（${link.name}）</div>
    <table class="info-table">
      <tr><td>上传需求数据</td><td>${s('upReqSpeed', 'K')}</td><td>上传需求包数</td><td>${p('upPackets')}</td></tr>

  rows.forEach(({ r }) => {

    });
  });
  const cell = (v, isPackets) => isPackets ? (v || 0).toLocaleString() : ((v || 0).toFixed(1) + (v >= 1000 ? ' M' : ' K'));
  const fmt = (v, isP) => isP ? v.toLocaleString() : (v >= 1000 ? (v / 1000).toFixed(2) + ' M' : v.toFixed(1) + ' K');

          <th rowspan="2">协议</th>

          <th>数据</th><th>需求速度</th><th>包数</th><th>分配速度</th><th>包数</th>

        </tr>
      </thead>

function drawTrafficAnalysisFrame(ctx, points, interval) {
  const W = 820, H = 260, padL = 55, padR = 15, padT = 24, padB = 28;
  const maxV = Math.max(1000, ...points.map(f => Math.max(...Object.values(f).map(v => v || 0))));
  const maxY = Math.ceil(maxV * 1.2 / 500) * 500;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#e2e8f0';
  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (H - padT - padB) * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillText(((4 - i) * maxY / 4 / 1024).toFixed(1) + 'M', 8, y + 4);
  }
  const n = points.length;
  const step = (W - padL - padR) / 59;
  const xOf = i => padL + i * step;
  const yOf = v => padT + (H - padT - padB) * (1 - v / maxY);
  const curves = getTrafficAnalysisCurves();
  curves.forEach(key => {
    ctx.beginPath();
    points.forEach((f, i) => i ? ctx.lineTo(xOf(i), yOf(f[key] || 0)) : ctx.moveTo(xOf(0), yOf(f[key] || 0)));
    ctx.strokeStyle = TRAFFIC_CURVES[key].color;
    ctx.lineWidth = 1.6;
    ctx.stroke();
  });
  ctx.font = '12px sans-serif';
  let lx = padL + 10;
  curves.forEach(key => {
    ctx.fillStyle = TRAFFIC_CURVES[key].color;

function ipToInt(ip) {
  const parts = String(ip).trim().split('.');
  if (parts.length !== 4) return null;
  let v = 0;
  for (const p of parts) {
    const n = parseInt(p, 10);
    if (isNaN(n) || n < 0 || n > 255) return null;
    v = (v << 8) + n;
  }
  return v >>> 0;
}

/* 解析输入：单个IP / 通配符(53.*.*.* 或 53.*) / 起止范围(53.0.0.0-53.255.255.255) */
function parseIpRange(input) {
  let str = String(input).trim();
  if (!str) return null;
  if (str.indexOf('-') !== -1) {
    const parts = str.split('-');
    if (parts.length !== 2) return null;
    const s = ipToInt(parts[0]), e = ipToInt(parts[1]);
    if (s === null || e === null || s > e) return null;
    return { start: parts[0].trim(), end: parts[1].trim() };
  }
  if (str.indexOf('*') !== -1) {
    const segs = str.split('.');
    if (segs.length > 4) return null;
    let start = '', end = '';
    for (let i = 0; i < 4; i++) {
      const seg = segs[i] === undefined ? '*' : segs[i];
      if (seg === '*') { start += (i ? '.' : '') + '0'; end += (i ? '.' : '') + '255'; }
      else {
        const n = parseInt(seg, 10);
        if (isNaN(n) || n < 0 || n > 255) return null;
        start += (i ? '.' : '') + n; end += (i ? '.' : '') + n;
      }
    }
    return { start, end };
  }
  const v = ipToInt(str);
  if (v === null) return null;
  return { start: str, end: str };
}

}

  const id = Date.now();

function syncMiniVal(id, arr, fmt) {
  const el = document.getElementById(id);
  if (el && arr.length) el.textContent = fmt(arr[arr.length - 1]);
}
function drawMiniFrame(ctx, arr, opts) {
  if (!ctx) return;
  const W = 280, H = 130, padL = 40, padR = 10, padT = 14, padB = 18;
  const maxY = opts.max;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#e2e8f0';
  ctx.fillStyle = '#64748b';
  ctx.font = '10px sans-serif';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = padT + (H - padT - padB) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    const val = (3 - i) * maxY / 3;
    ctx.fillText(maxY > 200 ? String(Math.round(val)) : val.toFixed(0), 4, y + 3);
  }
  const n = arr.length;
  const step = (W - padL - padR) / (n - 1 || 1);
  const xOf = i => padL + i * step;
  const yOf = v => padT + (H - padT - padB) * (1 - Math.min(v, maxY) / maxY);
  ctx.beginPath();
  arr.forEach((v, i) => i ? ctx.lineTo(xOf(i), yOf(v)) : ctx.moveTo(xOf(0), yOf(v)));
  ctx.strokeStyle = opts.color;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  if (arr.length) {
    ctx.fillStyle = opts.color;
    ctx.font = '11px sans-serif';
    ctx.fillText(opts.fmt(arr[arr.length - 1]), padL + 6, padT - 4);
  }
}

  }).join('');
}

function drawTrafficFrame(ctx, points, interval) {
  const W = 820, H = 260, padL = 55, padR = 15, padT = 20, padB = 28;
  const maxY = 4000;
  ctx.clearRect(0, 0, W, H);
  // grid
  ctx.strokeStyle = '#e2e8f0';
  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (H - padT - padB) * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillText(((4 - i) * maxY / 4 / 1024).toFixed(1) + 'M', 8, y + 4);
  }
  const n = points.length;
  const step = (W - padL - padR) / 59;
  const xOf = i => padL + i * step;
  const yOf = v => padT + (H - padT - padB) * (1 - v / maxY);
  // down fill
  ctx.beginPath();
  ctx.moveTo(padL, H - padB);
  points.forEach((p, i) => ctx.lineTo(xOf(i), yOf(p.down)));
  ctx.lineTo(padL + (n - 1) * step, H - padB);
  ctx.closePath();
  ctx.fillStyle = 'rgba(37, 99, 235, 0.12)';
  ctx.fill();
  // down line
  ctx.beginPath();
  points.forEach((p, i) => i ? ctx.lineTo(xOf(i), yOf(p.down)) : ctx.moveTo(xOf(0), yOf(p.down)));
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  // up line
  ctx.beginPath();
  points.forEach((p, i) => i ? ctx.lineTo(xOf(i), yOf(p.up)) : ctx.moveTo(xOf(0), yOf(p.up)));
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  // legend
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#2563eb';
  ctx.fillText('— 下载', padL + 10, padT - 6);
  ctx.fillStyle = '#10b981';
  ctx.fillText('— 上传', padL + 80, padT - 6);
  // x labels
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(interval + '秒/格', W - padR - 70, H - 8);
}

function calcBandwidthAgg() {
  const agg = mock.bandwidthAgg;
  const joined = agg.lines.filter(l => l.join && l.status === '在线');
  const totalUp = joined.reduce((s, l) => s + (parseInt(l.up) || 0), 0);
  const totalDown = joined.reduce((s, l) => s + (parseInt(l.down) || 0), 0);
  const totalWeight = joined.reduce((s, l) => s + (parseInt(l.weight) || 0), 0) || 1;
  const totalSessions = joined.reduce((s, l) => s + (l.sessions || 0), 0);
  return { joined, totalUp, totalDown, totalWeight, totalSessions };
}

function renderAggRows() {

function drawBandwidthAggFrame(ctx, points, idxs, interval) {
  const W = 820, H = 240, padL = 55, padR = 15, padT = 24, padB = 28;
  const maxDown = Math.max(1024, ...points.map(f => Math.max(...f.map(v => v || 0))));
  const maxY = Math.ceil(maxDown * 1.2 / 1024) * 1024;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#e2e8f0';
  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (H - padT - padB) * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillText(((4 - i) * maxY / 4 / 1024).toFixed(1) + 'M', 8, y + 4);
  }
  const n = points.length;
  const step = (W - padL - padR) / 59;
  const xOf = i => padL + i * step;
  const yOf = v => padT + (H - padT - padB) * (1 - v / maxY);
  const agg = mock.bandwidthAgg;
  idxs.forEach((li, k) => {
    ctx.beginPath();
    points.forEach((f, i) => i ? ctx.lineTo(xOf(i), yOf(f[li])) : ctx.moveTo(xOf(0), yOf(f[li])));
    ctx.strokeStyle = AGG_COLORS[k % 5];
    ctx.lineWidth = 1.6;
    ctx.stroke();
  });
  // legend
  ctx.font = '12px sans-serif';
  let lx = padL + 10;
  idxs.forEach((li, k) => {
    const name = (agg.lines[li] || {}).wan || ('线路' + (li + 1));
    ctx.fillStyle = AGG_COLORS[k % 5];
    ctx.fillText('— ' + name, lx, padT - 8);
    lx += 30 + name.length * 12;
  });
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(interval + '秒/格', W - padR - 70, H - 8);
}

function startBandwidthAggChart() {
  stopBandwidthAggChart();
  const canvas = document.getElementById('aggChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const points = Array.from({ length: 60 }, () => [0, 0, 0, 0, 0]);
  aggStopped = false;
  const joinedIdx = () => mock.bandwidthAgg.lines.map((l, i) => (l.join && l.status === '在线') ? i : -1).filter(i => i >= 0);
  const stopBtn = document.getElementById('aggStopBtn');
  if (stopBtn) stopBtn.textContent = '停止';
  drawBandwidthAggFrame(ctx, points, joinedIdx(), aggIntervalSec);
  updateAggLive();
  aggTimer = setInterval(() => {
    if (aggStopped) return;
    const idxs = joinedIdx();
    const next = [0, 0, 0, 0, 0];
    idxs.forEach(i => {
      const l = mock.bandwidthAgg.lines[i];
      l.realtimeDown = Math.random() * (parseInt(l.down) || 512) * 0.55 + (parseInt(l.down) || 512) * 0.05;
      l.realtimeUp = Math.random() * (parseInt(l.up) || 128) * 0.5 + (parseInt(l.up) || 128) * 0.05;
      l.sessions = Math.floor(Math.random() * 300 + 20);
      next[i] = l.realtimeDown;
    });
    points.push(next);
    if (points.length > 60) points.shift();
    drawBandwidthAggFrame(ctx, points, idxs, aggIntervalSec);
    updateAggLive();
    updateAggSummary();
  }, aggIntervalSec * 1000);
}

function stopBandwidthAggChart() {
  if (aggTimer) { clearInterval(aggTimer); aggTimer = null; }
}

function toggleAggStop() {
  aggStopped = !aggStopped;
  const btn = document.getElementById('aggStopBtn');
  if (btn) btn.textContent = aggStopped ? '继续' : '停止';
  showToast(aggStopped ? '叠加流量监控已停止' : '叠加流量监控已继续');
}

function setAggInterval(sec) {
  aggIntervalSec = parseInt(sec);
  showToast(`刷新间隔已设为 ${sec} 秒`);
  const canvas = document.getElementById('aggChart');
  if (canvas && !aggStopped) {
    stopBandwidthAggChart();

  }
}

function uploadIpLib(idx, el) {
  const g = mock.ipLibraries[idx];
  if (!el.files || !el.files[0]) return;
  const b = window.__goldenBridge;
  if (b && b.mode === 'real') {
    const reader = new FileReader();
    reader.onload = function () {
      const lines = String(reader.result || '').split(/\r?\n/).map(s => s.trim()).filter(s => /^\d+\.\d+\.\d+\.\d+\/\d+$/.test(s));
      if (!lines.length) { showToast('文件中未解析到合法 IP 段（CIDR），请检查格式'); return; }
      showToast(`${g.name} 正在导入 ${lines.length} 条地址段...`);
      Promise.resolve(b.run('ctcnc-import', null, JSON.stringify({ key: g.key, lines }))).then(res => {
        if (res && res.ok) {
          refreshCtcnc();
          showToast(`${g.name} 地址库导入完成（${res.imported} 条）`);
        } else {
          showToast((res && res.error) || '导入失败');
        }

  const hex = '0123456789ABCDEF';
  let mac = '';
  for (let i = 0; i < 6; i++) {

  }
  return mac;
}

function saveDhcp() {
  const start = document.getElementById('dhcpStart').value.trim();
  const end = document.getElementById('dhcpEnd').value.trim();
  const gateway = document.getElementById('dhcpGateway').value.trim();
  const lease = parseInt(document.getElementById('dhcpLease').value);
  if (!/^\d+\.\d+\.\d+\.\d+$/.test(start)) { showToast('开始地址格式不正确'); return; }
  if (!/^\d+\.\d+\.\d+\.\d+$/.test(end)) { showToast('结束地址格式不正确'); return; }
  if (!/^\d+\.\d+\.\d+\.\d+$/.test(gateway)) { showToast('网关格式不正确'); return; }
  if (!lease || lease < 60) { showToast('租约时间至少 60 秒'); return; }

  mock.dhcp = {
    enabled: document.getElementById('dhcpOn').checked,
    start: start,
    end: end,
    gateway: gateway,
    dns1: document.getElementById('dhcpDns1').value.trim(),
    dns2: document.getElementById('dhcpDns2').value.trim(),
    lease: lease
  };

  if (window.__goldenBridge && window.__goldenBridge.set) {
    window.__goldenBridge.set('dhcp', mock.dhcp).then(r => {
      if (r && r.ok) showToast('DHCP 设置已保存并已应用');
      else showToast('DHCP 设置已保存（演示模式）');
    }).catch(() => showToast('DHCP 设置已保存'));
  } else {
    showToast('DHCP 设置已保存');
  }
}

function saveAccess() {
  const updates = {};
  const httpPortEl = document.getElementById('accHttpPort');
  const loginLockEl = document.getElementById('accLoginLock');

  if (httpPortEl) {
    const port = parseInt(httpPortEl.value);
    const remotePort = parseInt(document.getElementById('accRemotePort').value);
    if (!port || port < 1 || port > 65535) { showToast('WEB 访问端口不合法'); return; }
    if (document.getElementById('accRemote').checked && (!remotePort || remotePort < 1 || remotePort > 65535)) { showToast('远程访问端口不合法'); return; }
    const adminPass = document.getElementById('accAdminPass').value;
    const adminPassConfirm = document.getElementById('accAdminPassConfirm').value;
    const guestPass = document.getElementById('accGuestPass').value;
    const guestPassConfirm = document.getElementById('accGuestPassConfirm').value;
    if (adminPass && adminPass !== adminPassConfirm) { showToast('管理员两次输入的密码不一致'); return; }
    if (guestPass && guestPass !== guestPassConfirm) { showToast('普通用户两次输入的密码不一致'); return; }
    updates.httpPort = port;
    updates.remoteAccess = document.getElementById('accRemote').checked;
    updates.remotePort = document.getElementById('accRemote').checked ? remotePort : mock.access.remotePort;
    updates.remoteAllow = document.getElementById('accRemoteAllow').value.trim();
    updates.adminUser = document.getElementById('accAdminUser').value.trim();
    updates.adminPass = adminPass;
    updates.adminPassConfirm = adminPassConfirm;
    updates.guestUser = document.getElementById('accGuestUser').value.trim();
    updates.guestPass = guestPass;
    updates.guestPassConfirm = guestPassConfirm;
  }

  if (loginLockEl) {
    updates.loginLock = parseInt(loginLockEl.value) || 5;
    updates.sessionTimeout = parseInt(document.getElementById('accSessionTimeout').value) || 15;
  }

  if (Object.keys(updates).length === 0) { showToast('没有需要保存的修改'); return; }
  mock.access = Object.assign({}, mock.access, updates);

  if (window.__goldenBridge && window.__goldenBridge.set) {
    window.__goldenBridge.set('advanced', mock.access).then(r => {
      if (r && r.ok) showToast('访问设置已保存并已应用');
      else showToast('访问设置已保存（演示模式）');
    }).catch(() => showToast('访问设置已保存'));
  } else {
    showToast('访问设置已保存');
  }
}

function saveSsh() {

      authKey: document.getElementById('sshAuthKey').value
    }
  });

/* ===== Ping helpers ===== */
function startPing() {
  const addr = document.getElementById('pingAddr').value.trim();
  const count = parseInt(document.getElementById('pingCount').value) || 5;
  const size = parseInt(document.getElementById('pingSize').value) || 56;
  if (!addr) { showToast('请输入要 Ping 的地址'); return; }
  if (count < 1 || count > 20) { showToast('Ping 包计数必须在 1-20 之间'); return; }
  mock.pingResults = [];
  const body = document.getElementById('pingResultBody');
  body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-light)">正在 Ping...（模拟）</td></tr>';
  let sent = 0;
  const timer = setInterval(() => {
    if (sent >= count) {
      clearInterval(timer);
      showToast(`Ping ${addr} 完成：${count} 个包`);
      return;
    }
    sent++;
    const latency = Math.floor(Math.random() * 40) + 8;
    const ttl = Math.floor(Math.random() * 20) + 50;
    const result = { addr, bytes: size, ttl, time: latency };
    mock.pingResults.push(result);
    body.innerHTML = mock.pingResults.map((r, i) => `<tr><td>${i+1}</td><td>${r.addr}</td><td>${r.bytes}</td><td>${r.ttl}</td><td>${r.time}</td></tr>`).join('');
  }, 400);
}

function clearPing() {
  mock.pingResults = [];
  const body = document.getElementById('pingResultBody');
  if (body) body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-light)">尚未执行 Ping</td></tr>';
}

/* ===== 主机监控：列配置 / 排序 / 显示控制 ===== */
const hostCols = [
  { key: 'user', label: '用户信息' },
  { key: 'ip', label: '主机IP地址' },
  { key: 'online', label: '上网时间' },
  { key: 'conn', label: '连接数' },
  { key: 'upTotal', label: '上传总数据' },
  { key: 'downTotal', label: '下传总数据' },
  { key: 'upReq', label: '上传需求速度' },
  { key: 'upAlloc', label: '上传分配速度' },
  { key: 'downReq', label: '下传需求速度' },
  { key: 'downAlloc', label: '下传分配速度' },
  { key: 'client', label: '客户端' }
];
const SORTABLE_HOST_KEYS = ['ip', 'online', 'conn', 'upAlloc', 'downAlloc'];
let hostColumns = { user: true, ip: true, online: true, conn: true, upTotal: false, downTotal: false, upReq: false, upAlloc: true, downReq: false, downAlloc: true, client: false };
let hostSort = { key: '', dir: 1 };

function hostCellValue(h, c) {
  switch (c.key) {
    case 'upTotal': return h.upTotal + ' MB';
    case 'downTotal': return h.downTotal + ' MB';
    case 'upReq': return h.upReqSpeed + ' K';
    case 'downReq': return h.downReqSpeed + ' K';
    case 'upAlloc': return h.up;
    case 'downAlloc': return h.down;
    default: return h[c.key];
  }
}

function renderHostTable() {
  const thead = document.getElementById('hostHeaderRow');
  const tbody = document.getElementById('hostTbody');
  if (!thead || !tbody) return;
  const cols = hostCols.filter(c => hostColumns[c.key]);
  thead.innerHTML = cols.map(c => {
    const sortable = SORTABLE_HOST_KEYS.includes(c.key);
    const arrow = hostSort.key === c.key ? (hostSort.dir === 1 ? ' ▲' : ' ▼') : '';
    return `<th class="${sortable ? 'sortable' : ''}" ${sortable ? `onclick="sortHosts('${c.key}')"` : ''} oncontextmenu="showHostHeaderMenu(event); return false;">${c.label}${arrow}</th>`;
  }).join('');
  const rows = [...mock.hosts];
  if (hostSort.key) {
    const { key, dir } = hostSort;
    rows.sort((a, b) => {
      let va, vb;
      if (key === 'ip') { va = parseInt(a.ip.split('.').pop()); vb = parseInt(b.ip.split('.').pop()); }
      else if (key === 'online') { va = a.online; vb = b.online; }
      else if (key === 'conn') { va = a.conn; vb = b.conn; }
      else if (key === 'upAlloc') { va = parseFloat(a.up) || 0; vb = parseFloat(b.up) || 0; }
      else if (key === 'downAlloc') { va = parseFloat(a.down) || 0; vb = parseFloat(b.down) || 0; }
      else { va = a[key]; vb = b[key]; }
      if (typeof va === 'string') { return va < vb ? -dir : (va > vb ? dir : 0); }
      return (va - vb) * dir;
    });
  }
  tbody.innerHTML = rows.map(h => {
    const origIdx = mock.hosts.indexOf(h);
    const cells = cols.map(c => `<td>${hostCellValue(h, c)}</td>`).join('');
    return `<tr data-idx="${origIdx}" oncontextmenu="showHostMenu(event, ${origIdx}); return false;">${cells}</tr>`;
  }).join('');
}

function sortHosts(key) {
  if (hostSort.key === key) hostSort.dir *= -1;
  else hostSort = { key, dir: 1 };
  renderHostTable();
  const label = hostCols.find(c => c.key === key).label;
  showToast(`按「${label}」${hostSort.dir === 1 ? '升序' : '降序'}排序`);
}

function showHostHeaderMenu(e) {
  e.preventDefault();
  const menu = document.getElementById('contextMenu');
  menu.className = 'context-menu ctx-menu-check';
  menu.innerHTML = hostCols.map(c => `
    <label class="ctx-check" onclick="event.stopPropagation()">
      <input type="checkbox" ${hostColumns[c.key] ? 'checked' : ''} onchange="toggleHostCol('${c.key}', this.checked)"> ${c.label}
    </label>
  `).join('');
  menu.style.left = Math.min(e.clientX, window.innerWidth - 190) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 380) + 'px';
  menu.style.display = 'block';
}

function toggleHostCol(key, checked) {
  hostColumns[key] = checked;
  renderHostTable();
}

function showHostMenu(e, idx) {
  e.preventDefault();
  const host = mock.hosts[idx];
  contextTarget = host;
  const menu = document.getElementById('contextMenu');
  menu.className = 'context-menu';
  menu.innerHTML = `
    <div onclick="hostAction('查看连接')">查看连接</div>
    <div onclick="hostAction('详细信息')">详细信息</div>
    <div onclick="hostAction('查看进程')">查看进程</div>
  `;
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.style.display = 'block';

  document.getElementById('contextMenu').style.display = 'none';

/* ===== 主机监控：查看连接 ===== */
/* 按主机 IP 确定性生成演示连接（同一主机每次打开数据一致，不同主机数据不同） */
function genHostConns(ip) {
  const n = parseInt((ip || '').split('.').pop()) || 10;
  const tmpl = [
    ['TCP', 443, '183.61.30.110', 'https', '广域网1'],
    ['TCP', 80, '39.156.66.10', 'http', '广域网1'],
    ['UDP', 53, '223.5.5.5', 'dns', '广域网1'],
    ['TCP', 443, '120.232.145.22', 'ssl', '广域网2'],
    ['TCP', 445, '192.168.10.20', 'smb', '局域网'],
    ['UDP', 137, '192.168.10.255', 'netbios', '局域网'],
    ['TCP', 443, '182.61.200.8', 'https', '广域网2'],
    ['TCP', 80, '101.226.103.98', 'http', '广域网1']
  ];
  const count = 4 + (n % 4); // 4~7 条
  return tmpl.slice(0, count).map((r, i) => {
    const mm = String(1 + ((n + i * 3) % 58)).padStart(2, '0');
    const ss = String((n * 3 + i * 17) % 60).padStart(2, '0');
    return {
      proto: r[0], localPort: 52000 + n * 7 + i * 13, remoteIp: r[2], remotePort: r[1], iface: r[4],
      runtime: `00:${mm}:${ss}`, up: `${((n + i) * 0.31 + 0.1).toFixed(1)} KB`, down: `${((n + i) * 3.7 + 1.2).toFixed(1)} KB`, type: r[3]
    };
  });
}

/* 读取当前主机的连接列表（不存在则生成缓存）；断开操作仅影响该主机 */
function getHostConns() {
  const ip = currentConnHost && currentConnHost.ip;
  if (!ip) return [];
  if (!mock.hostConnsMap[ip]) mock.hostConnsMap[ip] = genHostConns(ip);
  return mock.hostConnsMap[ip];
}

function hostConnRowsHtml() {
  const conns = getHostConns();
  return conns.map((c, i) => `
    <tr oncontextmenu="showConnMenu(event, ${i}); return false;">
      <td>${c.proto}</td><td>${c.localPort}</td><td>${c.remoteIp}</td><td>${c.remotePort}</td>
      <td>${c.iface}</td><td>${c.runtime}</td><td>${c.up}</td><td>${c.down}</td><td>${c.type}</td>
    </tr>
  `).join('');
}

function openHostConnections(h) {
  currentConnHost = h;
  const conns = getHostConns();
  openModal(`主机 ${h.ip} 的连接信息`, `
    <table class="data-table">
      <thead><tr><th>协议</th><th>本地端口</th><th>远端 IP</th><th>远端端口</th><th>接口</th><th>运行时间</th><th>上传数据</th><th>下载数据</th><th>类型</th></tr></thead>
      <tbody id="hostConnTbody">${hostConnRowsHtml()}</tbody>
    </table>
    <div id="hostConnPager">${renderPagination(1, 1, conns.length)}</div>
  `, `<button class="btn btn-success" onclick="refreshHostConns()">刷新</button><button class="btn btn-default" onclick="closeModal()">关闭</button>`, '900px');
}

function refreshHostConns() {
  const tbody = document.getElementById('hostConnTbody');
  const pager = document.getElementById('hostConnPager');
  if (tbody) tbody.innerHTML = hostConnRowsHtml();
  if (pager) pager.innerHTML = renderPagination(1, 1, getHostConns().length);
}

function showConnMenu(e, idx) {
  e.preventDefault();
  const list = getHostConns();
  const c = list[idx];
  if (!c) return;
  connContextTarget = { idx, conn: c };
  const menu = document.getElementById('contextMenu');
  menu.className = 'context-menu';
  menu.style.zIndex = '1000';
  menu.innerHTML = `
    <div onclick="connAction('this')">断开这条连接</div>
    <div onclick="connAction('type')">断开此类型连接</div>
    <div onclick="connAction('remoteIp')">断开此远端IP的连接</div>
    <div onclick="connAction('remotePort')">断开此远端端口的连接</div>
    <div onclick="connAction('proto')">断开此协议连接</div>
    <div onclick="connAction('all')">断开所有连接</div>
  `;
  menu.style.left = Math.min(e.pageX, window.innerWidth - 190) + 'px';
  menu.style.top = Math.min(e.pageY, window.innerHeight - 280) + 'px';
  menu.style.display = 'block';
}

/* 断开操作：全部限定在「当前选中主机」的连接范围内 */
function connAction(mode) {
  document.getElementById('contextMenu').style.display = 'none';
  const { idx, conn } = connContextTarget || {};
  const ip = currentConnHost && currentConnHost.ip;
  if (!conn || !ip) return;
  const msgs = {
    this: `已断开主机 ${ip} 上的该连接`,
    type: `已断开主机 ${ip} 上此类型连接`,
    remoteIp: `已断开主机 ${ip} 上到此远端IP的连接`,
    remotePort: `已断开主机 ${ip} 上到此远端端口的连接`,
    proto: `已断开主机 ${ip} 上此协议连接`,
    all: `已断开主机 ${ip} 上的所有连接`
  };
  const list = getHostConns();
  if (mode === 'this') list.splice(idx, 1);
  else if (mode === 'type') mock.hostConnsMap[ip] = list.filter(c => c.type !== conn.type);
  else if (mode === 'remoteIp') mock.hostConnsMap[ip] = list.filter(c => c.remoteIp !== conn.remoteIp);
  else if (mode === 'remotePort') mock.hostConnsMap[ip] = list.filter(c => c.remotePort !== conn.remotePort);
  else if (mode === 'proto') mock.hostConnsMap[ip] = list.filter(c => c.proto !== conn.proto);
  else if (mode === 'all') mock.hostConnsMap[ip] = [];
  refreshHostConns();
  showToast(msgs[mode] || '操作完成');
}

/* ===== 主机监控：查看进程 ===== */
function openHostProcesses(h) {
  const procs = mock.hostProcesses;
  const rowsHtml = procs.map(p => `
    <tr>
      <td>${p.conns}</td><td>${p.time}</td><td>${p.app}</td><td>${p.group}</td><td style="word-break:break-all">${p.file}</td>
      <td>${p.up}</td><td>${p.down}</td><td>${p.upSpeed}</td><td>${p.downSpeed}</td>

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

document.addEventListener('click', (e) => {
  // 右键产生的 click 不关闭菜单；点击菜单内部由菜单项自身处理；点击外部才关闭
  if (e.button === 2) return;
  const menu = document.getElementById('contextMenu');
  if (menu && menu.style.display === 'block' && menu.contains(e.target)) return;
  if (menu) menu.style.display = 'none';
});

/* ===== 真实模式：固件升级 / 参数备份 / 恢复（演示实现保留在 kernel，加载后覆盖） ===== */
window.addEventListener('load', function () {
  const b = window.__goldenBridge;
  const _demoBackup = window.sysBackup;
  const _demoRestore = window.sysRestore;
  const _demoUpgrade = window.sysUpgrade;
  const _demoReset = window.sysReset;

  // 恢复出厂：真实模式 = firstboot 清除配置 + 重启
  window.sysReset = function () {
    if (b && b.mode === 'real' && b.token) {
      if (!confirm('确定要恢复出厂设置吗？\n当前所有配置将被清除，路由器将重启（演示：真实设备立即执行）。')) return;
      showToast('正在恢复出厂设置，路由器即将重启...');
      b.run('reset').then(res => {
        showToast(res && res.reset ? '已清除配置，路由器正在重启...' : ((res && res.error) || '操作失败'));
      });
    } else if (_demoReset) { _demoReset(); }
  };

  // 保存参数：真实模式 = tar.gz 全量 UCI；演示 = JSON 导出
  window.sysBackup = function () {
    if (b && b.mode === 'real' && b.token) {
      b.run('backup').then(res => {
        if (res && res.b64) {
          try {
            const bin = atob(res.b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            const blob = new Blob([bytes], { type: 'application/gzip' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = res.filename || 'golden-backup.tar.gz';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
            showToast('系统参数已保存为 ' + a.download + '（' + (res.size / 1024).toFixed(1) + ' KB）');
          } catch (e) { showToast('备份文件生成失败：' + e.message); }
        } else showToast((res && res.error) || '备份失败');
      });
    } else if (_demoBackup) { _demoBackup(); }
  };

  // 恢复参数：真实模式 = 上传 tar.gz → 后端安全校验 → 自动备份当前 → 恢复
  window.sysRestore = function () {
    const f = document.getElementById('restoreFile');
    if (!f || !f.files || !f.files.length) { showToast('请先选择备份文件'); return; }
    const file = f.files[0];
    if (b && b.mode === 'real' && b.token) {
      if (file.size > 32 * 1024 * 1024) { showToast('备份文件过大（最大 32MB）'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const b64 = String(reader.result).split(',')[1] || '';
        if (!confirm('确定要恢复此备份吗？\n文件：' + file.name + '（' + (file.size / 1024).toFixed(1) + ' KB）\n\n恢复前将自动备份当前配置，恢复后网络服务重新加载。')) return;
        showToast('正在恢复参数，请稍候...');
        b.run('restore', null, JSON.stringify({ filename: file.name, b64: b64 })).then(res => {
          showToast(res && res.restored ? '参数已恢复，网络服务已重新加载' : ((res && res.error) || '恢复失败'));
        });
      };
      reader.readAsDataURL(file);
    } else if (_demoRestore) { _demoRestore(); }
  };

  // 固件升级：真实模式 = 上传 .bin → sysupgrade -T 完整性校验 → 输入 yes 二次确认 → 保留配置升级
  window.sysUpgrade = function () {
    const f = document.getElementById('firmwareFile');
    if (!f || !f.files || !f.files.length) { showToast('请先选择固件文件'); return; }
    const file = f.files[0];
    if (b && b.mode === 'real' && b.token) {
      if (file.size < 1024 * 1024 || file.size > 64 * 1024 * 1024) { showToast('固件大小需在 1MB-64MB 之间'); return; }
      showToast('正在上传并校验固件，请稍候...');
      b.run('upgrade', null, file)
        .then(data => {
          if (!data || !data.verified) { showToast('固件校验失败，已取消升级'); return; }
          const mb = (data.size / 1048576).toFixed(2);
          const yes = prompt('固件校验通过 ✓\n\n文件大小：' + mb + ' MB\nMD5：' + data.md5 + '\n\n升级将保留当前配置，写入后路由器自动重启（约 3-5 分钟）。\n请输入 yes 确认升级：');
          if (yes !== 'yes') { showToast('已取消升级'); return; }
          showToast('正在写入固件，路由器即将重启...');
          b.run('upgrade-confirm').then(r2 => {
            showToast(r2 && r2.rebooting ? '固件写入中，路由器正在重启（约 3-5 分钟）...' : ((r2 && r2.error) || '升级启动失败'));
          });
        })
        .catch(() => showToast('固件上传失败，请重试'));
    } else if (_demoUpgrade) { _demoUpgrade(); }
  };
});
